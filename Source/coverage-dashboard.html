                            console.log(`${feature.name} restored - now available in game`);
                            updateModStates(gameWindow);

                        }

                    console.log(`✅ PR #${feature.prNumber} merged. Game mode ${feature.name} restored.`);
                }

            // Check and complete PR merge for a feature
            const checkAndCompleteMerge = async (feature, type) => {
                setCheckingMerge(feature.name);
                setMergeSuccess(null);
                setManualCheckInProgress(true); // Lock auto-sync
                console.log(`🔍 Actively checking for merge on PR #${feature.prNumber}...`);

                const maxAttempts = 10; // 10 attempts over 5 seconds
                const delayBetweenChecks = 500; // 500ms between checks
                let attempt = 0;

                try {
                    // Keep checking until merged or timeout
                    while (attempt < maxAttempts) {
                        attempt++;
                        console.log(`   Attempt ${attempt}/${maxAttempts}: Checking GitHub...`);

                        const isMerged = await checkPRMerged(feature.prNumber);

                        if (isMerged) {
                            console.log(`✅ PR #${feature.prNumber} is CONFIRMED MERGED on GitHub! (found on attempt ${attempt})`);

                            // Show success message
                            setCheckingMerge(null);
                            setMergeSuccess(feature.name);

                            // Auto-pull git changes to sync local branch with Devin's merged changes
                            try {
                                console.log('🔄 Auto-pulling git changes after merge...');
                                const pullResponse = await fetch('http://localhost:8000/git-pull', {
                                    method: 'POST'
                                }).catch(() => null);

                                if (pullResponse && pullResponse.ok) {
                                    console.log('✅ Git pull successful - local branch is now synced');
                                } else {
                                    console.log('⚠️ Auto-pull not available (proxy server not running)');
                                }
                            } catch (err) {
                                console.log('⚠️ Auto-pull failed:', err.message);
                            }

                            // Show success message for 1.5 seconds, then auto-complete the transition
                            setTimeout(() => {
                                console.log(`🎉 Auto-completing ${type} for ${feature.name}...`);

                                // Call the appropriate completion function based on type
                                if (type === 'removal') {
                                    completeRemoval(feature);
                                } else if (type === 'restoration') {
                                    completeRestoration(feature);
                                }

                                // Clear success state
                                setMergeSuccess(null);
                                setManualCheckInProgress(false); // Unlock auto-sync

                                console.log(`✅ ${feature.name} successfully transitioned to ${type === 'removal' ? 'Removed' : 'Active'} state`);
                            }, 1500); // Show "Merge Complete!" for 1.5 seconds before transition

                            return true;
                        }

                        // Wait before next check (unless it's the last attempt)
                        if (attempt < maxAttempts) {
                            await new Promise(resolve => setTimeout(resolve, delayBetweenChecks));
                        }
                    }

                    // Timeout - merge not detected after 5 seconds
                    console.log(`⏳ PR #${feature.prNumber} not merged after ${attempt} attempts (5 seconds)`);
                    setCheckingMerge(null);
                    setManualCheckInProgress(false);

                    alert(`PR #${feature.prNumber} for "${feature.name}" hasn't been merged yet.\n\nMake sure the PR is merged on GitHub and try again.`);
                    return false;
                } catch (err) {
                    console.error('❌ Error checking merge:', err);
                    setCheckingMerge(null);
                    setManualCheckInProgress(false);
                    alert(`Error checking PR status: ${err.message}`);
                    return false;
                }

                    {/* Automation Modals (including improve-coverage) */}
                    {activeModal && activeModal.type !== 'coverage-details' && (
                        <AutomationModal
                            feature={activeModal.item || activeModal.feature}
                            type={activeModal.type}
                            onComplete={(result) => {
                                const { prNumber, replacementInfo } = result;
                                if (activeModal.type === 'remove') {
                                    handleRemoveComplete(activeModal.feature, prNumber);
                                } else if (activeModal.type === 'enable') {
                                    handleEnableComplete(activeModal.feature, prNumber);
                                } else if (activeModal.type === 'return-to-staging') {
                                    handleReturnToStagingComplete(activeModal.feature, prNumber);
                                } else if (activeModal.type === 'replace-flag') {
                                    handleReplaceComplete(
                                        activeModal.feature,
                                        prNumber,
                                        replacementInfo.oldFlagName,
                                        replacementInfo.newFlagName,
                                        replacementInfo.instruction
                                    );
                                } else if (activeModal.type === 'recover-flag') {
                                    handleRecoverFlagComplete(activeModal.feature, prNumber);
                                } else if (activeModal.type === 'improve-coverage') {
                                    // Coverage improvement complete - just close the modal
                                    // Could update coverage data here in the future
                                    console.log('Coverage improvement completed for', activeModal.item?.name);
                                    setActiveModal(null);
                                    return;
                                } else {
                                    handleRecoverComplete(activeModal.feature, prNumber);
                                }
                            }}
                            onCancel={() => setActiveModal(null)}
                            onRunInBackground={(sessionInfo) => {
                                addRunningSession({
                                    sessionId: sessionInfo.sessionId,
                                    url: sessionInfo.url,
                                    type: activeModal.type,
                                    name: (activeModal.item || activeModal.feature)?.name || 'Automation'
                                });
                                setActiveModal(null);
                            }}
                            onCreateRun={createRun}
                            onUpdateRun={updateRun}
                        />
                    )}

                    {/* Running Sessions Queue */}
                    <RunningSessionsQueue
                        sessions={runningSessions}
                        onViewSession={(session) => {
                            // Re-open modal to view progress (or open Devin URL)
                            window.open(session.url, '_blank');
                        }}
                        onRemoveSession={removeRunningSession}
                    />
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
